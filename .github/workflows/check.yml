name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on main are never cancelled halfway, so a dev database update always finishes (T96, D9).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, Check, Build & Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Format check
        run: pnpm format:check

      - name: Turbo check (typecheck, lint, test)
        run: pnpm check

      - name: Build
        run: pnpm build

      # Each storefront page's first JavaScript stays inside its budget (decisions T31, R49).
      - name: Storefront JS budget
        run: pnpm --filter @smartapp/tooling budget

      - name: Scan build outputs for leaks and forbidden strings
        run: |
          echo "Scanning dist/ and .next/ for demo emails, /kit, and localhost..."
          # Shipped code only: source maps carry the original text of every dependency (Next's own
          # source mentions localhost:3000 in comments) and are never served to browsers.
          SCAN="grep -r --exclude=*.map"
          LEAKS=0
          EMAILS=(
            "morales.juanmiguel0729+burger@gmail.com"
            "morales.juanmiguel0729+water@gmail.com"
            "morales.juanmiguel0729+tala@gmail.com"
            "morales.juanmiguel0729+cafe@gmail.com"
            "morales.juanmiguel0729+bakery@gmail.com"
          )
          for email in "${EMAILS[@]}"; do
            if $SCAN "$email" apps/*/dist apps/*/.next 2>/dev/null; then
              echo "ERROR: Demo email $email found in production bundle!"
              LEAKS=1
            fi
          done

          if $SCAN "/kit" apps/dashboard/dist apps/storefront/.next 2>/dev/null; then
            echo "ERROR: /kit found in client production bundle!"
            LEAKS=1
          fi

          # The dev-only mock scenario switch (?mock, ?as, ?now) must never ship in a storefront build.
          for dev_only in "setMockScenario" "mock-scenario"; do
            if $SCAN "$dev_only" apps/storefront/.next 2>/dev/null; then
              echo "ERROR: dev-only $dev_only found in the storefront production build!"
              LEAKS=1
            fi
          done

          DEV_URLS=(
            "localhost:3000"
            "localhost:4000"
            "localhost:5173"
            "http://127.0.0.1"
            "127.0.0.1:54321"
            "127.0.0.1:3000"
            "127.0.0.1:4000"
            "127.0.0.1:5173"
          )
          for dev_url in "${DEV_URLS[@]}"; do
            if $SCAN "$dev_url" apps/dashboard/dist apps/storefront/.next 2>/dev/null; then
              echo "ERROR: Dev URL $dev_url found in client production bundle!"
              LEAKS=1
            fi
          done

          if [ $LEAKS -ne 0 ]; then
            exit 1
          fi

  e2e:
    # Playwright smoke tests (decision T30): every storefront page at phone 390 and desktop 1280,
    # failing on console errors, sideways scroll and broken images.
    name: Storefront smoke tests (e2e)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the storefront
        run: pnpm turbo run build --filter=@smartapp/storefront

      - name: Install Chromium
        run: pnpm --filter @smartapp/tooling exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm e2e

      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tooling/test-results
          retention-days: 7

  ui-scan:
    # Decision T99: every page in the route catalog and the five kit pages on the preview builds (the
    # same builds as the public demo links), at 360, 768 and 1280 px, the dashboard in light and dark.
    # Fails on JavaScript or console errors, failed requests, sideways scroll and a settled desktop page
    # still keeping the processor busy (T110); the report and a screenshot of every page are uploaded
    # either way (no pixel baselines).
    name: UI scan (every page, 3 sizes, light and dark)
    runs-on: ubuntu-latest
    needs: check
    env:
      VITE_APP_ENV: preview
      VITE_DATA_SOURCE: mock
      VITE_SHOW_KIT: 'true'
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: preview
      VITE_API_URL: https://api.example.invalid
      VITE_STOREFRONT_URL: http://127.0.0.1:3200
      NEXT_PUBLIC_APP_ENV: preview
      NEXT_PUBLIC_DATA_SOURCE: mock
      NEXT_PUBLIC_DASHBOARD_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build both apps in preview mode
        run: pnpm turbo run build --filter=@smartapp/dashboard --filter=@smartapp/storefront

      - name: Install Chromium
        run: pnpm --filter @smartapp/tooling exec playwright install --with-deps chromium

      - name: Run the UI scan
        run: pnpm ui-scan

      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-scan-report
          path: tooling/test-results/ui-scan
          retention-days: 14
          if-no-files-found: ignore

  db:
    name: Supabase Migrations & Types Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase Stack
        run: pnpm exec supabase db start

      - name: Test Database (pgTAP)
        run: pnpm exec supabase test db

      - name: Verify Types Drift
        run: |
          pnpm exec supabase gen types typescript --local > packages/data/src/database.types.ts
          git diff --exit-code packages/data/src/database.types.ts

  db-deploy:
    # Decision T96 (D9): after every check and database test passes on main, apply new migrations to
    # the DEV project only. The live database is only ever changed by the founder by hand.
    name: Apply migrations to the dev database
    runs-on: ubuntu-latest
    needs: [check, db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: db-deploy-dev
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
    steps:
      - name: Check the dev database secrets are set
        id: secrets
        run: |
          # Decision T116 (conflict 8): a missing secret fails the job instead of a green skip.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_DEV_PROJECT_REF" ]; then
            echo "::error::Dev database secrets are missing (see docs/launch.md section 9)."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Install pnpm
        if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Link the dev project
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm exec supabase link --project-ref "$SUPABASE_DEV_PROJECT_REF"

      - name: Show the migrations that will run
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm exec supabase db push --dry-run

      - name: Apply new migrations
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm exec supabase db push

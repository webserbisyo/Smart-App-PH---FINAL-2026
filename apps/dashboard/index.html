<!doctype html>
<html lang="en" data-app="dashboard">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Add to Home Screen opens the dashboard on its own (decision T93); offline and push come with the backend. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preload"
      as="image"
      href="/brand/smartappph-mark-gradient.webp"
      fetchpriority="high"
    />
    <meta name="apple-mobile-web-app-title" content="Smart App" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f9fafd" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Smart App PH</title>
    <script>
      // Appearance before the first paint (decision T64; app/appearance.ts keeps it after).
      try {
        var a = localStorage.getItem('smartapp.dashboard.appearance');
        if (a === 'dark' || (a === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
      // Lines the opening screen up with iPhone's launch picture (decision T122; storefront LAUNCH_LIFT_SCRIPT).
      try {
        if (navigator.standalone === true) {
          var l = (screen.height - innerHeight) / 2;
          if (l > 0 && l < 40)
            document.documentElement.style.setProperty('--launch-lift', l + 'px');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- The installed app's opening screen (decisions T121, T122): painted before any script, in light or dark from
         the line above. app/boot-splash.ts lets it go once the app has drawn; CSS removes it at 3 s anyway. -->
    <div
      id="boot-splash"
      aria-hidden="true"
      class="boot-splash fixed inset-0 z-splash bg-background"
    >
      <!-- The content leaves first, then the colour (T122); lifted to sit exactly on the launch picture. -->
      <div class="absolute inset-0 flex splash-content items-center justify-center">
        <img
          src="/brand/smartappph-mark-gradient.webp"
          alt=""
          width="96"
          height="96"
          class="size-24 launch-lift"
        />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

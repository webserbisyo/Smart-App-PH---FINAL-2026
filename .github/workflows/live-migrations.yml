name: Apply migrations to live

# Decision T118 (Q14, task 8.1): the live database changes only when the founder presses Run here AND
# approves the `production` environment. It runs from `main` only, after the checks there passed, and shows
# the migrations it will apply before applying them. Nothing starts it by itself.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to change the live database'
        required: true
        type: string

permissions:
  contents: read
  # To read the Check run on this commit.
  actions: read

concurrency:
  group: db-deploy-live
  cancel-in-progress: false

jobs:
  plan:
    name: Show what will run
    runs-on: ubuntu-latest
    steps:
      - name: Check this is main and the word was typed
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this from main only."
            exit 1
          fi
          if [ "$CONFIRM" != "APPLY" ]; then
            echo "::error::Type APPLY (capital letters) to change the live database."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check main is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest Check run on this commit must have passed (T104: work goes straight to main).
          conclusion="$(gh api "repos/${{ github.repository }}/actions/workflows/check.yml/runs?head_sha=${{ github.sha }}&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::The Check workflow on this commit is '$conclusion'. Wait for it to pass on main first."
            exit 1
          fi

  apply:
    name: Apply to the live database
    runs-on: ubuntu-latest
    needs: [plan]
    # The founder approves this environment in GitHub (Settings, Environments, production, Required
    # reviewers). Its secrets exist only there.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_LIVE_DB_PASSWORD }}
      SUPABASE_LIVE_PROJECT_REF: ${{ secrets.SUPABASE_LIVE_PROJECT_REF }}
    steps:
      - name: Check the live database secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_LIVE_PROJECT_REF" ]; then
            echo "::error::Live database secrets are missing in the production environment (docs/launch.md Part G2)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link the live project
        run: pnpm exec supabase link --project-ref "$SUPABASE_LIVE_PROJECT_REF"

      - name: Show the migrations that will run
        run: pnpm exec supabase db push --dry-run

      - name: Apply new migrations
        run: pnpm exec supabase db push

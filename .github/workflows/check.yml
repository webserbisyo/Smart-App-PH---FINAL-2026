name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Check, Build & Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Format check
        run: pnpm format:check

      - name: Turbo check (typecheck, lint, test)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Scan build outputs for leaks and forbidden strings
        run: |
          echo "Scanning dist/ and .next/ for demo emails, /kit, and localhost..."
          # Shipped code only: source maps carry the original text of every dependency (Next's own
          # source mentions localhost:3000 in comments) and are never served to browsers.
          SCAN="grep -r --exclude=*.map"
          LEAKS=0
          EMAILS=(
            "morales.juanmiguel0729+burger@gmail.com"
            "morales.juanmiguel0729+water@gmail.com"
            "morales.juanmiguel0729+tala@gmail.com"
            "morales.juanmiguel0729+cafe@gmail.com"
            "morales.juanmiguel0729+bakery@gmail.com"
          )
          for email in "${EMAILS[@]}"; do
            if $SCAN "$email" apps/*/dist apps/*/.next 2>/dev/null; then
              echo "ERROR: Demo email $email found in production bundle!"
              LEAKS=1
            fi
          done

          if $SCAN "/kit" apps/dashboard/dist apps/storefront/.next 2>/dev/null; then
            echo "ERROR: /kit found in client production bundle!"
            LEAKS=1
          fi

          # The dev-only mock scenario switch (?mock, ?as, ?now) must never ship in a storefront build.
          for dev_only in "setMockScenario" "mock-scenario"; do
            if $SCAN "$dev_only" apps/storefront/.next 2>/dev/null; then
              echo "ERROR: dev-only $dev_only found in the storefront production build!"
              LEAKS=1
            fi
          done

          DEV_URLS=(
            "localhost:3000"
            "localhost:4000"
            "localhost:5173"
            "http://127.0.0.1"
            "127.0.0.1:54321"
            "127.0.0.1:3000"
            "127.0.0.1:4000"
            "127.0.0.1:5173"
          )
          for dev_url in "${DEV_URLS[@]}"; do
            if $SCAN "$dev_url" apps/dashboard/dist apps/storefront/.next 2>/dev/null; then
              echo "ERROR: Dev URL $dev_url found in client production bundle!"
              LEAKS=1
            fi
          done

          if [ $LEAKS -ne 0 ]; then
            exit 1
          fi

  e2e:
    # Playwright smoke tests (decision T30): every storefront page at phone 390 and desktop 1280,
    # failing on console errors, sideways scroll and broken images.
    name: Storefront smoke tests (e2e)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the storefront
        run: pnpm turbo run build --filter=@smartapp/storefront

      - name: Install Chromium
        run: pnpm --filter @smartapp/tooling exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm e2e

      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tooling/test-results
          retention-days: 7

  db:
    name: Supabase Migrations & Types Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase Stack
        run: pnpm exec supabase db start

      - name: Test Database (pgTAP)
        run: pnpm exec supabase test db

      - name: Verify Types Drift
        run: |
          pnpm exec supabase gen types typescript --local > packages/data/src/database.types.ts
          git diff --exit-code packages/data/src/database.types.ts
